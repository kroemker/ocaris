<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocaris — Midnight (dark + light)</title>
    <style>
      /* ============================================================
         THEME TOKENS
         :root            = Midnight dark (default)
         [data-theme=light] = Midnight light — same hues, inverted ramp
         The root attribute is set by JS from the Appearance setting
         (system | light | dark), mirroring Electron's nativeTheme.
         ============================================================ */
      :root {
        --page: #0a0c11;
        --bg: #0f1116;
        --bg2: #151922;
        --bg3: #1c212c;
        --fg: #e6e8ee;
        --dim: #8e97ab;
        --line: #262c38;
        --accent: #5b8cff;
        --accent-fg: #ffffff;
        --accent-soft: #1b2740;
        --ok: #3fbf7f;
        --warn: #e6b23c;
        --err: #ef5a5a;
        --shadow: 0 18px 50px rgba(0, 0, 0, .5);
        --thumb-shadow: 0 1px 3px rgba(0, 0, 0, .45);

        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --mono: Consolas, ui-monospace, monospace;
      }

      :root[data-theme='light'] {
        --page: #e9ecf1;
        --bg: #ffffff;
        --bg2: #f7f8fb;
        --bg3: #eceff5;
        --fg: #171a21;
        --dim: #646d80;
        --line: #dce0e9;
        --accent: #3568e0;
        --accent-fg: #ffffff;
        --accent-soft: #e4ecff;
        --ok: #1c8a56;
        --warn: #9a6c0a;
        --err: #cf3b3b;
        --shadow: 0 14px 40px rgba(28, 40, 70, .14);
        --thumb-shadow: 0 1px 3px rgba(0, 0, 0, .35);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--page); color: var(--fg);
        font-family: var(--font); font-size: 14px;
      }

      /* mockup-only strip */
      .mockbar {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 16px; font-size: 12px; color: var(--dim);
        background: var(--bg2); border-bottom: 1px solid var(--line);
      }
      .mockbar b { color: var(--fg); }
      .mockbar kbd {
        font-family: var(--mono); font-size: 11px; padding: 1px 6px;
        border: 1px solid var(--line); border-radius: 5px; background: var(--bg3);
      }
      .stage { padding: 22px; }

      /* ============================================================
         APP
         ============================================================ */
      .app {
        max-width: 1080px; margin: 0 auto; min-height: 760px;
        display: flex; flex-direction: column;
        background: var(--bg); border: 1px solid var(--line);
        border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
      }

      .topbar {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 18px; background: var(--bg2); border-bottom: 1px solid var(--line);
      }
      .brand { font-weight: 700; }
      .brand small {
        display: block; font-weight: 400; font-size: 10.5px; color: var(--dim);
        letter-spacing: .12em; text-transform: uppercase;
      }
      .spacer { flex: 1; }
      .search {
        background: var(--bg3); border: 1px solid var(--line); color: var(--fg);
        border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; min-width: 240px;
      }
      .search::placeholder { color: var(--dim); }
      .search:focus { outline: none; border-color: var(--accent); }

      .btn {
        font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--line); background: var(--bg3); color: var(--fg); white-space: nowrap;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn.ghost { background: transparent; }
      .btn.icon { padding: 7px 10px; }
      .btn.sm { font-size: 12px; padding: 5px 10px; }
      .btn[disabled] { opacity: .45; cursor: not-allowed; }

      /* ---------------- filter bar ---------------- */
      .filterbar {
        display: flex; align-items: center; gap: 7px;
        padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--bg);
      }
      .chip {
        font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--line); background: transparent; color: var(--dim);
        display: inline-flex; align-items: center; gap: 7px;
      }
      .chip:hover { color: var(--fg); border-color: color-mix(in srgb, var(--fg) 25%, var(--line)); }
      .chip .n {
        font-size: 11px; padding: 0 6px; border-radius: 999px;
        background: var(--bg3); color: var(--dim); line-height: 17px;
      }
      .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
      .chip.on .n { background: color-mix(in srgb, var(--accent-fg) 24%, transparent); color: var(--accent-fg); }
      .chip.alert:not(.on) { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }
      .chip[data-empty='true'] { opacity: .4; }
      .sortsel {
        font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 8px;
        background: var(--bg3); border: 1px solid var(--line); color: var(--dim); cursor: pointer;
      }

      /* ---------------- list ---------------- */
      .list { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
      .row {
        display: flex; gap: 16px; padding: 14px; border-radius: 10px;
        background: var(--bg2); border: 1px solid var(--line); transition: border-color .12s ease;
      }
      .row:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
      .row.is-error { border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }

      .thumb {
        flex: none; width: 104px; height: 78px; border-radius: 8px;
        display: grid; place-items: center; font-size: 21px; font-weight: 700; color: #fff;
        background: linear-gradient(135deg, var(--c1), var(--c2));
        text-shadow: var(--thumb-shadow); overflow: hidden;
      }

      .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .title { font-size: 15px; font-weight: 650; margin: 0 0 3px; }
      .meta {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        font-size: 12px; color: var(--dim); margin-bottom: 7px;
      }
      .meta .sep { opacity: .5; }
      .desc {
        font-size: 12.5px; color: var(--dim); line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .desc.err { color: var(--err); }
      .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* ---------------- right rail ---------------- */
      .side {
        flex: none; width: 168px; display: flex; flex-direction: column;
        align-items: stretch; justify-content: center; gap: 9px; text-align: right;
      }
      .side .btn { width: 100%; }
      .side .row-actions { display: flex; gap: 6px; }
      .side .row-actions .btn { flex: 1; }

      .status {
        display: flex; align-items: center; justify-content: flex-end; gap: 6px;
        font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600;
      }
      .status.ready { color: var(--ok); }
      .status.downloading { color: var(--accent); }
      .status.error { color: var(--err); }
      .status.available { color: var(--dim); font-weight: 500; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
      .status.downloading .dot { animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .25; } }

      .prog { display: flex; flex-direction: column; gap: 5px; }
      .bar { height: 4px; border-radius: 999px; background: var(--bg3); overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .prog .num { font-size: 11px; color: var(--dim); font-family: var(--mono); }

      .empty { padding: 60px 20px; text-align: center; color: var(--dim); }

      .statusline {
        display: flex; align-items: center; gap: 10px; padding: 8px 18px;
        border-top: 1px solid var(--line); background: var(--bg2); font-size: 12px; color: var(--dim);
      }
      .statusline .ok { color: var(--ok); }

      /* ---------------- settings modal ---------------- */
      .scrim {
        position: fixed; inset: 0; z-index: 60; padding: 26px;
        background: color-mix(in srgb, var(--page) 74%, transparent);
        backdrop-filter: blur(3px);
        display: none; align-items: center; justify-content: center;
      }
      .scrim.open { display: flex; }
      .modal {
        width: min(720px, 100%); height: min(540px, 100%); display: flex; flex-direction: column;
        background: var(--bg2); color: var(--fg); border: 1px solid var(--line); border-radius: 14px;
        overflow: hidden; box-shadow: 0 30px 90px rgba(0, 0, 0, .45);
      }
      .modal-h { display: flex; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--line); }
      .modal-h h3 { margin: 0; font-size: 15px; }
      .msplit { display: grid; grid-template-columns: 172px 1fr; flex: 1; min-height: 0; }
      .mside { background: var(--bg); border-right: 1px solid var(--line); padding: 12px 8px; }
      .mside button {
        display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
        background: none; border: none; color: var(--dim); padding: 8px 11px; border-radius: 7px; cursor: pointer;
      }
      .mside button:hover { color: var(--fg); }
      .mside button.on { background: var(--bg3); color: var(--fg); }
      .modal-b { padding: 18px; overflow: auto; }
      .modal-f {
        display: flex; gap: 10px; justify-content: flex-end;
        padding: 13px 18px; border-top: 1px solid var(--line); background: var(--bg);
      }
      .sec-title { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; }
      .field { margin-bottom: 16px; }
      .field > label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
      .ctl { display: flex; gap: 8px; }
      .ctl input, .ctl select {
        flex: 1; font: inherit; font-size: 13px; padding: 8px 11px; border-radius: 8px;
        background: var(--bg); border: 1px solid var(--line); color: var(--fg); font-family: var(--mono);
      }
      .hint { font-size: 11.5px; color: var(--dim); margin-top: 6px; display: flex; align-items: center; gap: 8px; }
      .pill {
        display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
        padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
      }
      .pill.ok { color: var(--ok); }
      .pill.flat { border-color: var(--line); color: var(--dim); }
      .emu-row {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; background: var(--bg);
      }
      .emu-row .path { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
      code { font-family: var(--mono); font-size: 11.5px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }

      /* ---------------- appearance picker (settings) ---------------- */
      .themes { display: flex; gap: 12px; }
      .theme-opt {
        flex: 1; cursor: pointer; border: 1px solid var(--line); border-radius: 11px;
        background: var(--bg); padding: 10px; text-align: left; font: inherit; color: var(--fg);
      }
      .theme-opt:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
      .theme-opt.on { border-color: var(--accent); background: var(--accent-soft); }
      .theme-opt .prev {
        height: 62px; border-radius: 7px; overflow: hidden; margin-bottom: 9px;
        border: 1px solid var(--line); display: flex; flex-direction: column;
      }
      .theme-opt .prev .p-bar { height: 15px; display: flex; align-items: center; padding: 0 6px; gap: 4px; }
      .theme-opt .prev .p-bar i { width: 16px; height: 4px; border-radius: 2px; display: block; }
      .theme-opt .prev .p-body { flex: 1; padding: 5px 6px; display: flex; flex-direction: column; gap: 4px; }
      .theme-opt .prev .p-row { height: 12px; border-radius: 3px; display: flex; align-items: center; gap: 4px; padding: 0 4px; }
      .theme-opt .prev .p-row b { width: 12px; height: 8px; border-radius: 2px; display: block; }
      .theme-opt .prev .p-row s { flex: 1; height: 3px; border-radius: 2px; display: block; }
      .theme-opt .prev .p-row u { width: 18px; height: 6px; border-radius: 2px; display: block; }
      .theme-opt .lbl { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
      .theme-opt .lbl .radio {
        width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--dim); flex: none;
        display: grid; place-items: center;
      }
      .theme-opt.on .lbl .radio { border-color: var(--accent); }
      .theme-opt.on .lbl .radio:after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
      .theme-opt .sub { font-size: 11.5px; color: var(--dim); margin-top: 4px; }
    </style>
  </head>
  <body>
    <div class="mockbar">
      <b>Ocaris — Midnight</b>
      <span>dark + light, one token set · theme lives in Settings → Appearance</span>
      <span class="spacer"></span>
      <span>press <kbd>L</kbd> to toggle · <kbd>Esc</kbd> closes the modal</span>
    </div>

    <div class="stage">
      <div class="app">
        <div class="topbar">
          <div class="brand">Ocaris<small>Mod launcher</small></div>
          <div class="spacer"></div>
          <input class="search" id="search" placeholder="Search mods or authors…" />
          <button class="btn">Refresh catalog</button>
          <button class="btn icon" data-open title="Settings">⚙</button>
        </div>

        <div class="filterbar" id="filters"></div>
        <div class="list" id="list"></div>

        <div class="statusline">
          <span id="count"></span>
          <span>·</span><span class="ok">ROM verified</span>
          <span>·</span><span>Ares (default)</span>
          <span class="spacer"></span>
          <span>Catalog refreshed 12m ago</span>
        </div>
      </div>
    </div>

    <div class="scrim" id="scrim">
      <div class="modal">
        <div class="modal-h">
          <h3>Settings</h3><div class="spacer"></div>
          <button class="btn icon ghost" data-close>✕</button>
        </div>
        <div class="msplit">
          <div class="mside" id="mside">
            <button class="on" data-pane="appearance">Appearance</button>
            <button data-pane="rom">ROM</button>
            <button data-pane="emu">Emulators</button>
            <button data-pane="cat">Catalog</button>
            <button data-pane="storage">Storage</button>
            <button data-pane="about">About</button>
          </div>
          <div class="modal-b" id="mbody"></div>
        </div>
        <div class="modal-f"><button class="btn" data-close>Close</button></div>
      </div>
    </div>

    <script>
      /* ============================================================
         APPEARANCE — 'system' | 'light' | 'dark'
         'system' follows prefers-color-scheme live, the same way
         Electron's nativeTheme.themeSource === 'system' would.
         ============================================================ */
      const media = window.matchMedia('(prefers-color-scheme: light)');
      let themePref = localStorage.getItem('ocaris.theme') || 'system';

      function resolvedTheme() {
        if (themePref === 'system') return media.matches ? 'light' : 'dark';
        return themePref;
      }
      function applyTheme() {
        document.documentElement.dataset.theme = resolvedTheme();
        const box = document.getElementById('mbody');
        if (box && box.querySelector('.themes')) paintThemeOpts();
      }
      function setTheme(pref) {
        themePref = pref;
        localStorage.setItem('ocaris.theme', pref);
        applyTheme();
      }
      media.addEventListener('change', () => { if (themePref === 'system') applyTheme(); });
      applyTheme();

      /* ============================================================
         CATALOG DATA
         ============================================================ */
      const MODS = [
        { name: 'The Missing Link', author: 'Kenix', completion: 'Complete', size: '32.0 MB',
          desc: 'A full-length quest set between Ocarina of Time and Majora’s Mask. New dungeon, new items, fully voiced cutscenes.',
          state: 'ready', c1: '#3b6ef0', c2: '#7b4bf0' },
        { name: 'OoT Randomizer', author: 'OoTR Team', completion: 'Complete', size: '18.1 MB',
          desc: 'Shuffles item locations, entrances, and dungeon layouts. The most-played OoT mod by a wide margin.',
          state: 'ready', c1: '#0f9d84', c2: '#1e6ea8' },
        { name: 'Dawn & Dusk', author: 'Nokaubure', completion: 'Complete', size: '6.6 MB',
          desc: 'Overhauled overworld with a day/night questline and a fully rebuilt Gerudo Valley.',
          state: 'downloading', pct: 62, got: '4.1', c1: '#e0873a', c2: '#c0405e' },
        { name: 'Ura Zelda Restoration', author: 'Zeldix', completion: 'Beta', size: '—',
          desc: 'Restores cut Master Quest content and beta assets from early builds.',
          state: 'error', err: 'No .bps patch in the archive matched your ROM', c1: '#8a6d3b', c2: '#5b4326' },
        { name: 'Zelda’s Birthday', author: 'SanguinettiMods', completion: 'Complete', size: '4.2 MB',
          desc: 'Short, comedic romp with a rewritten script. Good entry point — about two hours long.',
          state: 'not_downloaded', c1: '#c94f8d', c2: '#7040c0' },
        { name: 'The Sealed Palace', author: 'Tharo', completion: 'In development', size: '5.8 MB',
          desc: 'Single large dungeon focused on new puzzle mechanics and custom music.',
          state: 'not_downloaded', c1: '#4b7bd0', c2: '#2fae9c' },
        { name: 'Hylian Ruins', author: 'ShadowFire', completion: 'Complete', size: '9.4 MB',
          desc: 'Exploration-first romhack with a rebuilt Hyrule Field, no time limit, and hidden shrines.',
          state: 'not_downloaded', c1: '#3fa46b', c2: '#1f6f8b' },
        { name: 'Chaos Edition', author: 'Glank', completion: 'Complete', size: '3.1 MB',
          desc: 'Random effects fire every 15 seconds. Built for streams, not for sanity.',
          state: 'not_downloaded', c1: '#e04f4f', c2: '#b0308f' },
        { name: 'Song of Storms', author: 'Cielos', completion: 'Complete', size: '7.7 MB',
          desc: 'Weather-driven puzzles across a reworked Kakariko and Death Mountain.',
          state: 'not_downloaded', c1: '#5566c8', c2: '#2b3f8f' },
        { name: 'Termina Bound', author: 'Skawo', completion: 'Beta', size: '—',
          desc: 'Cross-game mashup pulling Majora’s Mask areas into the OoT engine.',
          state: 'error', err: 'Download is a .7z archive — Ocaris can’t extract it', c1: '#7a5cc0', c2: '#3c2f7a' }
      ];

      const FILTERS = [
        { id: 'all', label: 'All', match: () => true },
        { id: 'ready', label: 'Ready to play', match: (m) => m.state === 'ready' },
        { id: 'downloading', label: 'Downloading', match: (m) => m.state === 'downloading' },
        { id: 'available', label: 'Not installed', match: (m) => m.state === 'not_downloaded' },
        { id: 'error', label: 'Needs attention', match: (m) => m.state === 'error', alert: true }
      ];
      const STATUS = {
        ready:          { cls: 'ready',       text: 'Ready' },
        downloading:    { cls: 'downloading', text: 'Downloading' },
        error:          { cls: 'error',       text: 'Error' },
        not_downloaded: { cls: 'available',   text: 'Not installed' }
      };

      let activeFilter = 'all';
      let query = '';
      const initials = (n) => n.split(/[\s:&]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
      const matchQuery = (m) => !query.trim() || (m.name + ' ' + m.author).toLowerCase().includes(query.trim().toLowerCase());

      function renderFilters() {
        const pool = MODS.filter(matchQuery);
        document.getElementById('filters').innerHTML =
          FILTERS.map((f) => {
            const n = pool.filter(f.match).length;
            return `<button class="chip ${f.id === activeFilter ? 'on' : ''} ${f.alert && n ? 'alert' : ''}"
                      data-filter="${f.id}" data-empty="${n === 0 && f.id !== 'all'}">
                      ${f.label}<span class="n">${n}</span></button>`;
          }).join('') +
          `<span class="spacer"></span>
           <select class="sortsel">
             <option>Sort: Name (A–Z)</option><option>Sort: Recently added</option>
             <option>Sort: Author</option><option>Sort: Size</option>
           </select>`;
      }

      function side(m) {
        const s = STATUS[m.state];
        const label = `<div class="status ${s.cls}"><span class="dot"></span>${s.text}</div>`;
        if (m.state === 'downloading') return `
          ${label}
          <div class="prog">
            <div class="bar"><i style="width:${m.pct}%"></i></div>
            <div class="num">${m.got} / ${m.size} · ${m.pct}%</div>
          </div>
          <button class="btn sm">Cancel</button>`;
        if (m.state === 'ready') return `
          ${label}
          <button class="btn primary">▶ Play</button>
          <div class="row-actions"><button class="btn sm ghost">Folder</button><button class="btn sm ghost">Remove</button></div>`;
        if (m.state === 'error') return `
          ${label}
          <button class="btn">Retry</button>
          <button class="btn sm ghost">Open page ↗</button>`;
        return `${label}<button class="btn">Download</button>`;
      }

      function renderList() {
        const mods = MODS.filter((m) => FILTERS.find((f) => f.id === activeFilter).match(m) && matchQuery(m));
        document.getElementById('list').innerHTML = mods.length
          ? mods.map((m) => `
              <div class="row ${m.state === 'error' ? 'is-error' : ''}">
                <div class="thumb" style="--c1:${m.c1};--c2:${m.c2}">${initials(m.name)}</div>
                <div class="body">
                  <h3 class="title clip">${m.name}</h3>
                  <div class="meta">
                    <span>${m.author}</span><span class="sep">·</span>
                    <span>${m.completion}</span><span class="sep">·</span>
                    <span>${m.size}</span>
                  </div>
                  <div class="desc ${m.state === 'error' ? 'err' : ''}">${m.state === 'error' ? m.err : m.desc}</div>
                </div>
                <div class="side">${side(m)}</div>
              </div>`).join('')
          : '<div class="empty">No mods match this filter.</div>';
        document.getElementById('count').textContent = `${mods.length} of ${MODS.length} mods`;
      }
      const render = () => { renderFilters(); renderList(); };

      document.getElementById('filters').addEventListener('click', (e) => {
        const chip = e.target.closest('[data-filter]');
        if (!chip) return;
        activeFilter = chip.dataset.filter;
        render();
      });
      document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; render(); });
      render();

      /* ============================================================
         SETTINGS PANES
         ============================================================ */
      /* miniature app preview drawn from a fixed palette, so each card
         shows its own theme regardless of the one currently applied */
      function preview(p) {
        return `
          <div class="prev" style="background:${p.bg}">
            <div class="p-bar" style="background:${p.bg2};border-bottom:1px solid ${p.line}">
              <i style="background:${p.fg};opacity:.7"></i>
              <i style="background:${p.accent};margin-left:auto;width:10px"></i>
            </div>
            <div class="p-body">
              ${[0, 1, 2].map((i) => `
                <div class="p-row" style="background:${p.bg2};border:1px solid ${p.line}">
                  <b style="background:${p.accent};opacity:${0.9 - i * 0.25}"></b>
                  <s style="background:${p.fg};opacity:.35"></s>
                  <u style="background:${i === 0 ? p.accent : p.line}"></u>
                </div>`).join('')}
            </div>
          </div>`;
      }
      const PALETTE = {
        dark:  { bg: '#0f1116', bg2: '#151922', line: '#262c38', fg: '#e6e8ee', accent: '#5b8cff' },
        light: { bg: '#ffffff', bg2: '#f7f8fb', line: '#dce0e9', fg: '#171a21', accent: '#3568e0' }
      };

      function themePane() {
        const sysNow = media.matches ? 'light' : 'dark';
        return `
          <div class="sec-title">Appearance</div>
          <div class="themes">
            <button class="theme-opt" data-theme-opt="system">
              ${preview(PALETTE[sysNow])}
              <div class="lbl"><span class="radio"></span>System</div>
              <div class="sub">Follows Windows — currently ${sysNow}</div>
            </button>
            <button class="theme-opt" data-theme-opt="light">
              ${preview(PALETTE.light)}
              <div class="lbl"><span class="radio"></span>Light</div>
              <div class="sub">Midnight Light</div>
            </button>
            <button class="theme-opt" data-theme-opt="dark">
              ${preview(PALETTE.dark)}
              <div class="lbl"><span class="radio"></span>Dark</div>
              <div class="sub">Midnight</div>
            </button>
          </div>
          <p class="hint" style="margin-top:16px">Applies immediately. Stored with the rest of app config.</p>`;
      }
      function paintThemeOpts() {
        document.querySelectorAll('[data-theme-opt]').forEach((b) => {
          b.classList.toggle('on', b.dataset.themeOpt === themePref);
        });
      }

      const PANES = {
        appearance: themePane,
        rom: () => `
          <div class="sec-title">ROM</div>
          <div class="field">
            <label>ROM file — OoT 1.0 (U)</label>
            <div class="ctl"><input value="D:\\ROMs\\zelda_oot_1.0_u.z64" readonly /><button class="btn">Browse…</button></div>
            <div class="hint"><span class="pill ok">✓ Header CRC verified</span><span>compressed · CRC1 EC7011B7</span></div>
          </div>
          <p class="hint">Ocaris never modifies this file — patched copies go to the output folder.</p>`,
        emu: () => `
          <div class="sec-title">Emulators</div>
          <div class="emu-row">
            <div style="flex:1"><div style="font-weight:600">Ares <span class="pill flat">default</span></div>
              <div class="path">C:\\Emulators\\ares\\ares.exe</div></div>
            <button class="btn sm">Edit</button><button class="btn sm ghost">Remove</button>
          </div>
          <div class="emu-row">
            <div style="flex:1"><div style="font-weight:600">Project64</div>
              <div class="path">C:\\Program Files\\Project64\\Project64.exe</div></div>
            <button class="btn sm">Edit</button><button class="btn sm ghost">Remove</button>
          </div>
          <button class="btn">+ Add emulator</button>
          <div class="field" style="margin-top:18px">
            <label>Launch arguments (Ares)</label>
            <div class="ctl"><input value="--fullscreen {romPath}" /></div>
            <div class="hint"><code>{romPath}</code> is replaced with the patched ROM path.</div>
          </div>`,
        cat: () => `
          <div class="sec-title">Catalog</div>
          <div class="field">
            <label>Source</label>
            <div class="ctl"><select><option>hylianmodding.com</option><option>Local folder…</option></select>
              <button class="btn">Refresh now</button></div>
            <div class="hint">41 OoT mods cached · last refreshed 12 minutes ago</div>
          </div>
          <div class="field"><label><input type="checkbox" checked /> Refresh catalog on startup</label></div>`,
        storage: () => `
          <div class="sec-title">Storage</div>
          <div class="field">
            <label>Patched ROM output folder</label>
            <div class="ctl"><input value="C:\\Users\\leo\\Documents\\Ocaris\\patched" readonly /><button class="btn">Browse…</button></div>
            <div class="hint">3 patched ROMs · 96.2 MB</div>
          </div>
          <button class="btn">Open folder</button> <button class="btn ghost">Clear downloads</button>`,
        about: () => `
          <div class="sec-title">About</div>
          <p style="margin-top:0">Ocaris 0.1.0 — local desktop hub for Ocarina of Time mods.</p>
          <p class="hint">Electron · better-sqlite3 · BPS patch engine</p>`
      };

      const scrim = document.getElementById('scrim');
      const mbody = document.getElementById('mbody');

      function openPane(id) {
        mbody.innerHTML = PANES[id]();
        if (id === 'appearance') paintThemeOpts();
      }
      openPane('appearance');

      document.querySelectorAll('[data-open]').forEach((b) => (b.onclick = () => scrim.classList.add('open')));
      scrim.addEventListener('click', (e) => {
        if (e.target === scrim || e.target.closest('[data-close]')) scrim.classList.remove('open');
      });
      document.getElementById('mside').addEventListener('click', (e) => {
        const b = e.target.closest('[data-pane]');
        if (!b) return;
        [...b.parentElement.children].forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        openPane(b.dataset.pane);
      });
      mbody.addEventListener('click', (e) => {
        const opt = e.target.closest('[data-theme-opt]');
        if (opt) setTheme(opt.dataset.themeOpt);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') scrim.classList.remove('open');
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'l' || e.key === 'L') setTheme(resolvedTheme() === 'dark' ? 'light' : 'dark');
      });

      /* fake download progress so the row feels alive */
      setInterval(() => {
        const m = MODS.find((x) => x.state === 'downloading');
        if (!m) return;
        m.pct = m.pct >= 99 ? 4 : m.pct + 1;
        m.got = (parseFloat(m.size) * m.pct / 100).toFixed(1);
        renderList();
      }, 900);
    </script>
  </body>
</html>
